server.port=5000

# ------------------------------------------------------------------
# Supabase PostgreSQL Database Credentials
# Replace [YOUR-PROJECT-REF] and [YOUR-SUPABASE-PASSWORD] below!
# ------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://db.[YOUR-PROJECT-REF].supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=[YOUR-SUPABASE-PASSWORD]
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

